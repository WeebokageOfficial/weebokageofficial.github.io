<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin | WEEBOKAGE</title>
    <link rel="stylesheet" href="style.css?v=13.0">
    <link rel="stylesheet" href="responsive.css?v=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="site.js?v=1.0"></script>
</head>
<body class="guarded">
    <nav aria-label="Admin navigation"><div class="links">
        <a href="index.html">View Site</a>
        <a href="islam.html">Islam</a>
        <a href="transit.html">Transit</a>
        <a href="#logout" id="logout-button" style="color:var(--primary)">Logoff</a>
    </div></nav>

    <main class="container">
        <section class="card" style="border-top:5px solid var(--primary);">
            <h1 style="color:var(--primary);font-size:1.6rem;margin-bottom:20px;">SECURE ARCHIVE</h1>
            <div id="archive-links" aria-live="polite"><p>Loading protected links…</p></div>
        </section>

        <form class="card" id="post-form">
            <h2>NEW POST</h2>
            <div class="input-group">
                <label class="sr-only" for="pTitle">Post title</label>
                <input type="text" id="pTitle" maxlength="120" placeholder="Title" required>
            </div>
            <div class="input-group">
                <label class="sr-only" for="pContent">Post content</label>
                <textarea id="pContent" maxlength="10000" placeholder="Content…" style="min-height:180px;padding-left:15px!important;" required></textarea>
            </div>
            <button type="submit" id="post-button" class="btn">DEPLOY</button>
            <p id="post-status" role="status" style="margin-top:15px;"></p>
        </form>
    </main>

    <script>
        "use strict";
        Weebokage.initFirebase();
        const db = firebase.firestore();

        async function loadPrivateLinks() {
            const container = document.getElementById("archive-links");
            try {
                const response = await Weebokage.apiFetch("/admin/config");
                const data = await response.json();
                container.replaceChildren();
                for (const entry of data.drives || []) {
                    const title = document.createElement("h2");
                    title.style.cssText = "font-size:1rem;margin-top:20px";
                    title.textContent = entry.title;
                    const link = document.createElement("a");
                    link.href = Weebokage.safeUrl(entry.url);
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";
                    link.className = "btn";
                    link.textContent = entry.label;
                    container.append(title, link);
                }
                if (!container.childElementCount) container.textContent = "No protected links are configured.";
            } catch (_) {
                container.textContent = "Protected links are unavailable. Check backend configuration.";
            }
        }

        firebase.auth().onAuthStateChanged((user) => {
            if (!user) {
                window.location.replace("login.html?next=downloads.html");
                return;
            }
            document.body.classList.remove("guarded");
            loadPrivateLinks();
        });

        document.getElementById("logout-button").addEventListener("click", async (event) => {
            event.preventDefault();
            await firebase.auth().signOut();
            window.location.replace("index.html");
        });

        document.getElementById("post-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            const title = document.getElementById("pTitle").value.trim();
            const content = document.getElementById("pContent").value.trim();
            const button = document.getElementById("post-button");
            const status = document.getElementById("post-status");
            if (!title || !content || !firebase.auth().currentUser) return;
            button.disabled = true;
            status.textContent = "Publishing…";
            try {
                await db.collection("posts").add({
                    title: title.slice(0, 120),
                    content: content.slice(0, 10000),
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                event.currentTarget.reset();
                status.textContent = "Post published.";
            } catch (_) {
                status.textContent = "Post could not be published.";
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
