<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Login | WEEBOKAGE</title>
    <link rel="stylesheet" href="style.css?v=13.0">
    <link rel="stylesheet" href="responsive.css?v=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="site.js?v=1.0"></script>
    <style>
        .login-card { max-width:450px;margin:10vh auto;text-align:center;padding:50px!important;border-top:5px solid var(--primary); }
        #err { color:#fff;display:none;margin-top:20px;font-size:.8rem;background:rgba(255,45,85,.18);padding:12px;border-radius:8px;border:1px solid #ff2d55; }
        @media (max-width:500px) { .login-card { margin:5vh auto;padding:28px 20px!important; } }
    </style>
</head>
<body>
    <div class="theme-switch-wrapper" aria-label="Theme selection">
        <button class="icon-button" onclick="setTheme('miku')" aria-label="Use Miku theme" style="cursor:pointer;font-size:1.2rem;background:none;border:0;">🩵</button>
        <label class="switch" aria-label="Toggle theme"><input type="checkbox" id="theme-toggle" onclick="themeToggle()"><span class="slider"></span></label>
        <button class="icon-button" onclick="setTheme('teto')" aria-label="Use Teto theme" style="cursor:pointer;font-size:1.2rem;background:none;border:0;">🥖</button>
    </div>

    <nav aria-label="Main navigation"><div class="links">
        <a href="index.html">Home</a>
        <a href="transit.html" class="admin-hide" id="nav-transit">Transit</a>
        <a href="islam.html" class="admin-hide" id="nav-islam">Islam</a>
        <a href="anime.html">Anime</a>
        <a href="games.html">Games</a>
        <a href="credits.html">Credits</a>
        <a href="login.html" id="admin-btn" aria-current="page">Admin</a>
    </div></nav>

    <main class="container">
        <form class="card login-card" id="login-form">
            <header style="margin-bottom:35px;">
                <h1 style="color:var(--primary);font-size:clamp(1.4rem,8vw,1.8rem);letter-spacing:5px;text-transform:uppercase;overflow-wrap:anywhere;">System Auth</h1>
                <div aria-hidden="true" style="width:50px;height:3px;background:var(--accent);margin:10px auto;border-radius:2px;box-shadow:0 0 10px var(--accent);"></div>
            </header>
            <p style="font-size:.75rem;opacity:.65;margin-bottom:25px;letter-spacing:2px;">IDENTIFY TO DECRYPT ARCHIVE</p>
            <div class="input-group">
                <label class="sr-only" for="email">Email address</label>
                <input type="email" id="email" placeholder="Vocaloid ID (Email)" maxlength="254" autocomplete="username" required>
                <i class="fas fa-user-circle" aria-hidden="true"></i>
            </div>
            <div class="input-group">
                <label class="sr-only" for="pass">Password</label>
                <input type="password" id="pass" placeholder="Access Key" maxlength="4096" autocomplete="current-password" required>
                <i class="fas fa-fingerprint" aria-hidden="true"></i>
            </div>
            <button type="submit" id="loginBtn" class="btn" style="width:100%;margin-top:20px;height:50px;letter-spacing:2px;">INITIALIZE</button>
            <p id="err" role="alert"></p>
        </form>
    </main>

    <script>
        "use strict";
        Weebokage.initFirebase();
        Weebokage.setTheme(localStorage.getItem("theme") || "miku");
        const allowedDestinations = new Set(["downloads.html", "transit.html", "islam.html"]);
        const requestedDestination = new URLSearchParams(window.location.search).get("next");
        const destination = allowedDestinations.has(requestedDestination) ? requestedDestination : "downloads.html";

        firebase.auth().onAuthStateChanged((user) => {
            if (user) window.location.replace(destination);
        });

        document.getElementById("login-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            const button = document.getElementById("loginBtn");
            const errorBox = document.getElementById("err");
            button.disabled = true;
            button.textContent = "AUTHENTICATING…";
            errorBox.style.display = "none";
            try {
                await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);
                await firebase.auth().signInWithEmailAndPassword(
                    document.getElementById("email").value.trim(),
                    document.getElementById("pass").value
                );
                window.location.replace(destination);
            } catch (_) {
                errorBox.textContent = "ACCESS DENIED: CHECK YOUR CREDENTIALS";
                errorBox.style.display = "block";
                button.disabled = false;
                button.textContent = "INITIALIZE";
            }
        });
    </script>
</body>
</html>
