<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>Arcade Terminal | WEEBOKAGE</title>
    <meta name="description" content="Play classic browser games in the Weebokage arcade.">
    <link rel="stylesheet" href="style.css?v=13.0">
    <link rel="stylesheet" href="responsive.css?v=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="site.js?v=1.0"></script>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script src="https://js-dos.com/v7/build/js-dos.js"></script>
    <link href="https://js-dos.com/v7/build/js-dos.css" rel="stylesheet">
    <style>
        .game-container { width:100%;max-width:900px;height:min(600px,70dvh);min-height:360px;background:#000;border:2px solid var(--primary);box-shadow:0 0 30px var(--primary-glow);border-radius:20px;overflow:hidden;display:none;margin:30px auto;position:relative; }
        .jsdos-container,#ruffle-canvas,ruffle-player { width:100%!important;height:100%!important; }
        .game-grid { display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:25px;margin-top:20px; }
        .game-card { color:#fff;text-align:center;cursor:pointer;padding:50px!important;font:inherit; }
        .game-card i { font-size:4rem;color:var(--primary);margin-bottom:20px; }
        #loading-overlay { position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;color:var(--primary);font-weight:bold;letter-spacing:2px;text-align:center;padding:20px; }
        .mobile-game-note { display:none;margin:10px auto;max-width:650px;opacity:.8;text-align:center; }
        @media (max-width:700px) {
            #arcade-header h1 { font-size:clamp(2rem,12vw,3.5rem)!important;letter-spacing:2px!important;overflow-wrap:anywhere; }
            .game-card { padding:32px 20px!important; }
            .game-container { height:min(520px,65dvh);min-height:300px;border-radius:12px; }
            .mobile-game-note { display:block; }
        }
    </style>
</head>
<body>
    <div class="theme-switch-wrapper" aria-label="Theme selection">
        <button class="icon-button" onclick="setTheme('miku')" aria-label="Use Miku theme" style="cursor:pointer;font-size:1.2rem;background:none;border:0;">🩵</button>
        <label class="switch" aria-label="Toggle theme"><input type="checkbox" id="theme-toggle" onclick="themeToggle()"><span class="slider"></span></label>
        <button class="icon-button" onclick="setTheme('teto')" aria-label="Use Teto theme" style="cursor:pointer;font-size:1.2rem;background:none;border:0;">🥖</button>
    </div>

    <nav aria-label="Main navigation"><div class="links">
        <a href="index.html">Home</a>
        <a href="transit.html" class="admin-hide" id="nav-transit">Transit</a>
        <a href="islam.html" class="admin-hide" id="nav-islam">Islam</a>
        <a href="anime.html">Anime</a>
        <a href="games.html" aria-current="page">Games</a>
        <a href="credits.html">Credits</a>
        <a href="login.html" id="admin-btn">Admin</a>
    </div></nav>

    <main class="container">
        <header id="arcade-header" style="text-align:center;margin-bottom:50px;">
            <h1 style="color:var(--primary);font-size:3.5rem;letter-spacing:5px;text-transform:uppercase;">Arcade Terminal</h1>
            <p style="opacity:.65;letter-spacing:2px;">Simulation Uplink: Stable</p>
        </header>
        <p class="mobile-game-note">A physical keyboard is recommended for DOS games. Touch controls depend on the emulator.</p>

        <div class="game-grid" id="selection-area">
            <button type="button" class="card game-card" onclick="loadDoom()">
                <i class="fas fa-skull" aria-hidden="true"></i>
                <h2>DOOM (1993)</h2>
                <span style="display:block;font-size:.85rem;opacity:.6;margin-top:10px;">Engine: JS-DOS v7</span>
            </button>
            <button type="button" class="card game-card" onclick="loadFlash('assets/Mario_Combat.swf')">
                <i class="fas fa-fist-raised" aria-hidden="true"></i>
                <h2>Mario Combat</h2>
                <span style="display:block;font-size:.85rem;opacity:.6;margin-top:10px;">Engine: Ruffle Flash</span>
            </button>
        </div>

        <section id="player-wrapper" class="game-container" aria-label="Game player">
            <div id="loading-overlay" hidden>
                <i class="fas fa-sync fa-spin" style="font-size:2rem;margin-bottom:15px;" aria-hidden="true"></i>
                <span id="loading-text">INITIALIZING…</span>
            </div>
            <div id="ruffle-canvas" hidden></div>
            <div id="dos-canvas" class="jsdos-container" hidden></div>
        </section>
        <div style="text-align:center;">
            <button id="closeBtn" class="btn" hidden style="margin-top:20px;background:#ff2d55;color:#fff;" onclick="window.location.reload()">TERMINATE SESSION</button>
        </div>
    </main>

    <aside id="miku-chat-container" style="position:fixed;bottom:20px;left:20px;z-index:2000;" aria-label="AI assistant">
        <div id="miku-window" hidden role="dialog" aria-labelledby="ai-title" style="display:none;width:350px;height:500px;background:rgba(10,11,16,.95);backdrop-filter:blur(20px);border:2px solid var(--primary);border-radius:20px;flex-direction:column;overflow:hidden;box-shadow:0 0 30px var(--primary-glow);margin-bottom:15px;">
            <div style="background:var(--primary);color:#000;padding:12px;font-weight:bold;display:flex;justify-content:space-between;"><span id="ai-title">MIKU SYSTEM 01</span><button class="icon-button" onclick="toggleMiku()" aria-label="Close chat" style="cursor:pointer;background:none;border:0;font-size:1.3rem;">&times;</button></div>
            <div id="miku-msgs" aria-live="polite" style="flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:15px;font-size:.9rem;"></div>
            <div style="padding:15px;display:flex;gap:10px;border-top:1px solid rgba(255,255,255,.1);"><label class="sr-only" for="miku-input">Chat message</label><input type="text" id="miku-input" maxlength="1000" placeholder="Ask about games…" style="margin:0;border-radius:12px;"><button onclick="askMiku()" class="btn" aria-label="Send message" style="width:50px;height:50px;border-radius:50%;padding:0;"><i class="fas fa-paper-plane" aria-hidden="true"></i></button></div>
        </div>
        <button id="miku-btn" class="icon-button" onclick="toggleMiku()" aria-label="Open AI chat" aria-expanded="false" style="width:70px;height:70px;border-radius:50%;background-image:var(--pfp);background-size:cover;border:3px solid var(--primary);cursor:pointer;box-shadow:0 0 20px var(--primary-glow);"></button>
    </aside>

    <script src="chat.js?v=1.0"></script>
    <script>
        "use strict";
        Weebokage.initFirebase();
        Weebokage.setTheme(localStorage.getItem("theme") || "miku");
        WeebokageChat.initialize();
        Weebokage.bindAuthNavigation({ onChange: (user) => WeebokageChat.setUser(user) });

        function prepareUI(message) {
            document.getElementById("selection-area").hidden = true;
            document.getElementById("arcade-header").hidden = true;
            const wrapper = document.getElementById("player-wrapper");
            wrapper.style.display = "block";
            const overlay = document.getElementById("loading-overlay");
            overlay.hidden = false;
            overlay.style.display = "flex";
            document.getElementById("loading-text").textContent = message;
            document.getElementById("closeBtn").hidden = false;
        }

        function showGameError(message) {
            const overlay = document.getElementById("loading-overlay");
            overlay.hidden = false;
            overlay.style.display = "flex";
            document.getElementById("loading-text").textContent = message;
        }

        function loadDoom() {
            prepareUI("INITIALIZING DOOM.EXE…");
            const canvas = document.getElementById("dos-canvas");
            canvas.hidden = false;
            if (typeof window.Dos !== "function") {
                showGameError("JS-DOS could not be loaded.");
                return;
            }
            window.Dos(canvas, { wdboxUrl: "https://js-dos.com/v7/build/wdbox.js" })
                .run("assets/doom.zip")
                .then(() => {
                    const overlay = document.getElementById("loading-overlay");
                    overlay.hidden = true;
                    overlay.style.display = "none";
                })
                .catch(() => showGameError("DOOM could not be started."));
        }

        function loadFlash(path) {
            prepareUI("INITIALIZING RUFFLE…");
            const canvas = document.getElementById("ruffle-canvas");
            canvas.hidden = false;
            try {
                const ruffle = window.RufflePlayer.newest();
                const player = ruffle.createPlayer();
                canvas.appendChild(player);
                player.load({ url: path, scale: "showAll" });
                const overlay = document.getElementById("loading-overlay");
                overlay.hidden = true;
                overlay.style.display = "none";
            } catch (_) {
                showGameError("Ruffle could not be started.");
            }
        }
    </script>
</body>
</html>
