<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>Anime Archive | WEEBOKAGE</title>
    <meta name="description" content="Search the Weebokage anime archive.">
    <link rel="stylesheet" href="style.css?v=13.0">
    <link rel="stylesheet" href="responsive.css?v=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="site.js?v=1.0"></script>
    <style>
        .anime-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:25px;margin-top:30px; }
        .ani-card { color:#fff;padding:0!important;overflow:hidden;border-bottom:4px solid var(--primary);height:400px;display:flex;flex-direction:column;cursor:pointer;position:relative;text-align:left;font:inherit; }
        .ani-card img { width:100%;height:280px;object-fit:cover; }
        .ani-info { padding:12px;background:rgba(10,11,16,.9);flex:1; }
        .ani-title { font-size:.85rem;font-weight:bold;color:var(--primary);height:2.5em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical; }
        .ani-score { position:absolute;top:10px;right:10px;background:var(--primary);color:#000;padding:3px 8px;border-radius:5px;font-weight:bold;font-size:.75rem;z-index:5; }
        #anime-modal-backdrop { display:none;position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);overflow-y:auto;padding:40px 20px; }
        #anime-modal-backdrop.open { display:flex;justify-content:center;align-items:flex-start; }
        #anime-modal { background:rgba(10,11,16,.97);border:1px solid var(--primary);box-shadow:0 0 40px var(--primary-glow);border-radius:20px;width:100%;max-width:960px;position:relative;overflow:hidden;margin-bottom:50px; }
        #modal-close { position:absolute;top:18px;right:20px;z-index:100;background:var(--primary);color:#000;border:0;border-radius:50%;width:44px;height:44px;font-size:1.2rem;cursor:pointer;font-weight:bold; }
        #modal-banner { display:flex;min-height:320px;background:#000;border-bottom:2px solid var(--primary); }
        #modal-cover { width:230px;min-width:230px;object-fit:cover;border-right:2px solid var(--primary); }
        #modal-header-info { padding:40px;flex:1;display:flex;flex-direction:column;justify-content:center; }
        #modal-title-en { font-size:clamp(1.6rem,5vw,2.2rem);font-weight:bold;color:var(--primary);line-height:1.2;margin-bottom:15px;overflow-wrap:anywhere; }
        .modal-badge { background:rgba(255,255,255,.07);border:1px solid var(--primary);color:var(--primary);padding:6px 16px;border-radius:20px;font-size:.75rem;font-weight:bold;text-transform:uppercase;margin:5px;display:inline-block; }
        .modal-body { padding:40px; }
        .modal-section-title { color:var(--primary);font-size:.8rem;font-weight:bold;text-transform:uppercase;letter-spacing:3px;border-left:4px solid var(--primary);padding-left:15px;margin:40px 0 20px; }
        #modal-stats-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(min(160px,100%),1fr));gap:15px; }
        .stat-item { background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:15px;text-align:center;overflow-wrap:anywhere; }
        .stat-val { font-size:1.1rem;font-weight:bold;color:var(--primary); }
        .stat-lbl { font-size:.65rem;opacity:.6;text-transform:uppercase;margin-top:5px; }
        #modal-chars-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(min(170px,100%),1fr));gap:20px; }
        .char-card { background:rgba(255,255,255,.03);border-radius:15px;overflow:hidden;border:1px solid rgba(255,255,255,.08); }
        .char-card img { width:100%;height:160px;object-fit:cover; }
        .char-info { padding:12px; }
        .char-name { font-size:.8rem;font-weight:bold;color:var(--primary); }
        .char-role,.char-va { font-size:.7rem;opacity:.7;margin-top:5px; }
        .relation-item { display:flex;gap:15px;align-items:center;justify-content:space-between;background:rgba(255,255,255,.03);padding:12px 20px;border-radius:12px;margin-bottom:10px;overflow-wrap:anywhere; }
        .rel-type { font-size:.75rem;font-weight:bold;color:var(--primary);text-transform:uppercase; }
        .rel-name { font-size:.85rem;text-align:right; }
        @media (max-width:768px) {
            #anime-modal-backdrop { padding:12px; }
            #modal-banner { flex-direction:column; }
            #modal-cover { width:100%;height:300px;min-width:0;border-right:0;border-bottom:2px solid var(--primary); }
            #modal-header-info,.modal-body { padding:24px; }
        }
        @media (max-width:420px) {
            #modal-cover { height:240px; }
            #modal-header-info,.modal-body { padding:18px; }
            .relation-item { align-items:flex-start;flex-direction:column; }
            .rel-name { text-align:left; }
        }
    </style>
</head>
<body>
    <div class="theme-switch-wrapper" aria-label="Theme selection">
        <button class="icon-button" onclick="setTheme('miku')" aria-label="Use Miku theme" style="cursor:pointer;font-size:1.2rem;background:none;border:0;">🩵</button>
        <label class="switch" aria-label="Toggle theme"><input type="checkbox" id="theme-toggle" onclick="themeToggle()"><span class="slider"></span></label>
        <button class="icon-button" onclick="setTheme('teto')" aria-label="Use Teto theme" style="cursor:pointer;font-size:1.2rem;background:none;border:0;">🥖</button>
    </div>

    <nav aria-label="Main navigation"><div class="links">
        <a href="index.html">Home</a>
        <a href="transit.html" class="admin-hide" id="nav-transit">Transit</a>
        <a href="islam.html" class="admin-hide" id="nav-islam">Islam</a>
        <a href="anime.html" aria-current="page">Anime</a>
        <a href="games.html">Games</a>
        <a href="credits.html">Credits</a>
        <a href="login.html" id="admin-btn">Admin</a>
    </div></nav>

    <main class="container">
        <header style="text-align:center;margin-bottom:50px;">
            <h1 style="color:var(--primary);letter-spacing:4px;text-transform:uppercase;">Anime Database</h1>
            <div class="card" style="max-width:600px;margin:20px auto;padding:25px;">
                <div class="input-group" style="margin-bottom:0;">
                    <label class="sr-only" for="aniSearch">Anime title</label>
                    <input type="search" id="aniSearch" maxlength="100" placeholder="Enter anime title…">
                    <i class="fas fa-search" aria-hidden="true"></i>
                </div>
                <button id="search-button" class="btn" style="width:100%;margin-top:15px;letter-spacing:2px;height:50px;">QUERY ARCHIVE</button>
            </div>
        </header>
        <h2 id="grid-header" style="color:var(--primary);border-left:4px solid var(--primary);padding-left:15px;letter-spacing:1px;">DATA STREAM: TRENDING</h2>
        <div class="anime-grid" id="anime-results" aria-live="polite"></div>
    </main>

    <div id="anime-modal-backdrop" onclick="handleBackdropClick(event)">
        <section id="anime-modal" role="dialog" aria-modal="true" aria-label="Anime details">
            <button id="modal-close" onclick="closeModal()" aria-label="Close anime details">✕</button>
            <div id="modal-content"></div>
        </section>
    </div>

    <script>
        "use strict";
        Weebokage.initFirebase();
        Weebokage.setTheme(localStorage.getItem("theme") || "miku");
        Weebokage.bindAuthNavigation();
        const escapeHTML = Weebokage.escapeHTML;

        async function fetchAnime(search = "") {
            const results = document.getElementById("anime-results");
            results.innerHTML = '<p class="status-message" style="grid-column:1/-1">Connecting to archive…</p>';
            const query = search ? "?search=" + encodeURIComponent(search.slice(0, 100)) : "";
            try {
                const response = await Weebokage.apiFetch("/anime-proxy" + query);
                const list = await response.json();
                results.replaceChildren();
                list.forEach((anime) => {
                    const card = document.createElement("button");
                    card.type = "button";
                    card.className = "card ani-card";
                    card.addEventListener("click", () => openAnimeDetail(Number(anime.mal_id)));
                    const score = document.createElement("span");
                    score.className = "ani-score";
                    score.textContent = "⭐ " + (anime.score ?? "??");
                    const image = document.createElement("img");
                    image.src = Weebokage.safeUrl(anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url);
                    image.alt = "";
                    image.loading = "lazy";
                    image.decoding = "async";
                    const info = document.createElement("span");
                    info.className = "ani-info";
                    const title = document.createElement("span");
                    title.className = "ani-title";
                    title.textContent = anime.title || "Untitled";
                    const meta = document.createElement("span");
                    meta.style.cssText = "display:block;font-size:.65rem;opacity:.65;margin-top:5px";
                    meta.textContent = (anime.type || "Unknown") + " • " + (anime.status || "Unknown");
                    info.append(title, meta);
                    card.append(score, image, info);
                    results.appendChild(card);
                });
                if (!list.length) results.innerHTML = '<p class="status-message" style="grid-column:1/-1">No anime found.</p>';
            } catch (_) {
                results.innerHTML = '<p class="status-message" style="grid-column:1/-1">The anime archive is currently unavailable.</p>';
            }
        }

        async function openAnimeDetail(malId) {
            if (!Number.isInteger(malId) || malId <= 0) return;
            const backdrop = document.getElementById("anime-modal-backdrop");
            const content = document.getElementById("modal-content");
            content.innerHTML = '<p class="status-message" style="padding:80px 20px">Initializing data uplink…</p>';
            backdrop.classList.add("open");
            document.body.style.overflow = "hidden";
            document.getElementById("modal-close").focus();
            try {
                const response = await Weebokage.apiFetch("/anime-detail/" + malId);
                renderModal(await response.json());
            } catch (_) {
                content.innerHTML = '<p class="status-message" style="padding:80px 20px">Anime details are currently unavailable.</p>';
            }
        }

        function renderModal(data) {
            const info = data.info || {};
            const characters = Array.isArray(data.characters) ? data.characters : [];
            const relations = Array.isArray(info.relations) ? info.relations : [];
            const text = (value, fallback = "N/A") => escapeHTML(value ?? fallback);
            const image = (value) => escapeHTML(Weebokage.safeUrl(value));

            const charactersHTML = characters.map((entry) => {
                const actor = entry.voice_actors?.find((item) => item.language === "Japanese");
                return '<article class="char-card"><img loading="lazy" alt="" src="' + image(entry.character?.images?.jpg?.image_url) + '">' +
                    '<div class="char-info"><div class="char-name">' + text(entry.character?.name, "Unknown") + '</div>' +
                    '<div class="char-role">' + text(entry.role) + '</div><div class="char-va">🎙 ' + text(actor?.person?.name, "Unknown VA") + '</div></div></article>';
            }).join("") || '<p>No character data available.</p>';

            const relationsHTML = relations.map((relation) =>
                '<div class="relation-item"><span class="rel-type">' + text(relation.relation) + '</span>' +
                '<span class="rel-name">' + text(relation.entry?.[0]?.name) + '</span></div>'
            ).join("") || '<p>No related media available.</p>';

            const stat = (value, label) => '<div class="stat-item"><div class="stat-val">' + text(value) + '</div><div class="stat-lbl">' + label + '</div></div>';
            document.getElementById("modal-content").innerHTML =
                '<div id="modal-banner"><img id="modal-cover" alt="" src="' + image(info.images?.jpg?.large_image_url) + '">' +
                '<div id="modal-header-info"><div id="modal-title-en">' + text(info.title_english || info.title, "Untitled") + '</div><div>' +
                '<span class="modal-badge">⭐ ' + text(info.score) + ' Score</span><span class="modal-badge">Rank #' + text(info.rank) + '</span><span class="modal-badge">' + text(info.type) + '</span></div></div></div>' +
                '<div class="modal-body"><div class="modal-section-title">Terminal Statistics</div><div id="modal-stats-grid">' +
                stat(info.episodes, "Episodes") + stat(info.status, "Status") + stat(info.duration, "Duration") +
                stat(info.rating, "Age Rating") + stat(info.season, "Season") + stat(info.year, "Release Year") + '</div>' +
                '<div class="modal-section-title">Synopsis</div><p style="line-height:1.8;white-space:pre-wrap">' + text(info.synopsis, "No summary available.") + '</p>' +
                '<div class="modal-section-title">Characters &amp; Voices</div><div id="modal-chars-grid">' + charactersHTML + '</div>' +
                '<div class="modal-section-title">Related Sequences</div><div>' + relationsHTML + '</div></div>';
        }

        function closeModal() {
            document.getElementById("anime-modal-backdrop").classList.remove("open");
            document.body.style.overflow = "";
            document.getElementById("search-button").focus();
        }
        function handleBackdropClick(event) {
            if (event.target.id === "anime-modal-backdrop") closeModal();
        }

        document.getElementById("search-button").addEventListener("click", () => fetchAnime(document.getElementById("aniSearch").value.trim()));
        document.getElementById("aniSearch").addEventListener("keydown", (event) => {
            if (event.key === "Enter") fetchAnime(event.currentTarget.value.trim());
        });
        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && document.getElementById("anime-modal-backdrop").classList.contains("open")) closeModal();
        });
        fetchAnime();
    </script>
</body>
</html>
