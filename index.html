<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>Weebokage's Archive and Dashboard</title>
    <meta name="description" content="Welcome to my digital terminal. Explore my personal blog, anime database, Islamic archives, and classic arcade modules.">
    <link rel="stylesheet" href="style.css?v=13.0">
    <link rel="stylesheet" href="responsive.css?v=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="site.js?v=1.0"></script>
</head>
<body>
    <div class="theme-switch-wrapper" aria-label="Theme selection">
        <button class="icon-button" onclick="setTheme('miku')" aria-label="Use Miku theme" style="cursor:pointer;font-size:1.2rem;background:none;border:0;">🩵</button>
        <label class="switch" aria-label="Toggle theme"><input type="checkbox" id="theme-toggle" onclick="themeToggle()"><span class="slider"></span></label>
        <button class="icon-button" onclick="setTheme('teto')" aria-label="Use Teto theme" style="cursor:pointer;font-size:1.2rem;background:none;border:0;">🥖</button>
    </div>

    <nav aria-label="Main navigation">
        <div class="links">
            <a href="index.html">Home</a>
            <a href="transit.html" class="admin-hide" id="nav-transit">Transit</a>
            <a href="islam.html" class="admin-hide" id="nav-islam">Islam</a>
            <a href="anime.html">Anime</a>
            <a href="games.html">Games</a>
            <a href="credits.html">Credits</a>
            <a href="login.html" id="admin-btn">Admin</a>
        </div>
    </nav>

    <main class="container">
        <section class="card profile-card">
            <div class="profile-avatar" role="img" aria-label="Weebokage profile picture"></div>
            <div class="profile-info">
                <h1>Weebokage</h1>
                <p>Digital Workspace &amp; Archive. Welcome to my personal digital sector.</p>
                <div class="profile-tags" style="margin-top:15px;">
                    <span class="tag">DEVELOPER</span>
                    <span class="tag">VOCALOID</span>
                    <span class="tag">ARCHIVIST</span>
                </div>
                <a href="https://www.youtube.com/@Weebokage/featured" target="_blank" rel="noopener noreferrer" class="btn" style="background:#f00;color:#fff;margin-top:20px;border:none;">
                    <i class="fab fa-youtube" aria-hidden="true"></i> YouTube
                </a>
            </div>
        </section>

        <h2 style="color:var(--primary);margin:50px 0 25px;border-left:4px solid var(--primary);padding-left:15px;letter-spacing:2px;">LATEST UPDATES</h2>
        <div id="blog-feed" aria-live="polite"><p class="status-message">Loading updates…</p></div>

        <h2 style="color:var(--primary);margin:60px 0 25px;border-left:4px solid var(--primary);padding-left:15px;letter-spacing:2px;">DIGITAL GUESTBOOK</h2>
        <section class="card" aria-labelledby="guestbook-heading">
            <h3 id="guestbook-heading" class="sr-only">Write a guestbook message</h3>
            <div class="input-group">
                <label class="sr-only" for="guestName">Your alias</label>
                <input type="text" id="guestName" placeholder="Your Alias" maxlength="40" autocomplete="nickname">
                <i class="fas fa-user-tag" aria-hidden="true"></i>
            </div>
            <div class="input-group">
                <label class="sr-only" for="guestMsg">Message</label>
                <textarea id="guestMsg" placeholder="Leave a message…" maxlength="500" style="height:100px;padding-top:15px!important;"></textarea>
                <i class="fas fa-comment-dots textarea-icon" aria-hidden="true"></i>
            </div>
            <button onclick="postComment()" id="commentBtn" class="btn" style="width:100%;height:50px;letter-spacing:2px;">DEPLOY MESSAGE</button>
            <p id="comment-status" role="status" style="margin-top:12px;"></p>
        </section>
        <div id="comments-feed" aria-live="polite"></div>

        <footer style="text-align:center;margin-top:80px;opacity:.5;font-size:.8rem;letter-spacing:2px;padding-bottom:110px;">
            <p>&copy; 2026 WEEBOKAGE. All rights reserved.</p>
        </footer>
    </main>

    <aside id="miku-chat-container" style="position:fixed;bottom:20px;left:20px;z-index:2000;" aria-label="AI assistant">
        <div id="miku-window" hidden role="dialog" aria-labelledby="ai-title" style="display:none;width:350px;height:500px;background:rgba(10,11,16,.95);backdrop-filter:blur(20px);border:2px solid var(--primary);border-radius:20px;flex-direction:column;overflow:hidden;box-shadow:0 0 30px var(--primary-glow);margin-bottom:15px;">
            <div style="background:var(--primary);color:#000;padding:12px;font-weight:bold;display:flex;justify-content:space-between;">
                <span id="ai-title">MIKU SYSTEM 01</span>
                <button class="icon-button" onclick="toggleMiku()" aria-label="Close chat" style="cursor:pointer;background:none;border:0;font-size:1.3rem;">&times;</button>
            </div>
            <div id="miku-msgs" aria-live="polite" style="flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:15px;font-size:.9rem;"></div>
            <div style="padding:15px;display:flex;gap:10px;border-top:1px solid rgba(255,255,255,.1);">
                <label class="sr-only" for="miku-input">Chat message</label>
                <input type="text" id="miku-input" maxlength="1000" placeholder="Type here…" style="margin:0;border-radius:12px;">
                <button onclick="askMiku()" class="btn" aria-label="Send message" style="width:50px;height:50px;border-radius:50%;padding:0;"><i class="fas fa-paper-plane" aria-hidden="true"></i></button>
            </div>
        </div>
        <button id="miku-btn" class="icon-button" onclick="toggleMiku()" aria-label="Open AI chat" aria-expanded="false" style="width:70px;height:70px;border-radius:50%;background-image:var(--pfp);background-size:cover;border:3px solid var(--primary);cursor:pointer;box-shadow:0 0 20px var(--primary-glow);"></button>
    </aside>

    <script src="chat.js?v=1.0"></script>
    <script>
        "use strict";
        Weebokage.initFirebase();
        const db = firebase.firestore();

        Weebokage.setTheme(localStorage.getItem("theme") || "miku");
        WeebokageChat.initialize();
        Weebokage.bindAuthNavigation({ onChange: (user) => WeebokageChat.setUser(user) });

        function renderPost(data) {
            const card = document.createElement("article");
            card.className = "card";
            const date = document.createElement("time");
            date.style.cssText = "color:var(--accent);font-size:.8rem;font-weight:bold";
            if (data.timestamp?.toDate) {
                const value = data.timestamp.toDate();
                date.dateTime = value.toISOString();
                date.textContent = value.toLocaleDateString();
            }
            const title = document.createElement("h2");
            title.textContent = String(data.title || "Untitled").slice(0, 120);
            card.append(date, title);
            const imageUrl = Weebokage.safeUrl(data.image);
            if (imageUrl) {
                const image = document.createElement("img");
                image.src = imageUrl;
                image.alt = "";
                image.loading = "lazy";
                image.decoding = "async";
                image.className = "miku-img";
                card.appendChild(image);
            }
            const content = document.createElement("p");
            content.textContent = String(data.content || "");
            content.style.cssText = "margin-top:10px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere";
            card.appendChild(content);
            return card;
        }

        db.collection("posts").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
            const feed = document.getElementById("blog-feed");
            feed.replaceChildren(...snapshot.docs.map((documentSnapshot) => renderPost(documentSnapshot.data())));
            if (!snapshot.size) feed.innerHTML = '<p class="status-message">No updates yet.</p>';
        }, () => {
            document.getElementById("blog-feed").innerHTML = '<p class="status-message">Updates are currently unavailable.</p>';
        });

        async function postComment() {
            const name = document.getElementById("guestName").value.trim();
            const message = document.getElementById("guestMsg").value.trim();
            const status = document.getElementById("comment-status");
            const button = document.getElementById("commentBtn");
            if (!name || !message) {
                status.textContent = "Please enter an alias and a message.";
                return;
            }
            button.disabled = true;
            status.textContent = "Sending…";
            try {
                await db.collection("comments").add({
                    name: name.slice(0, 40),
                    msg: message.slice(0, 500),
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                document.getElementById("guestName").value = "";
                document.getElementById("guestMsg").value = "";
                status.textContent = "Message sent.";
            } catch (_) {
                status.textContent = "Message could not be sent.";
            } finally {
                button.disabled = false;
            }
        }

        function renderComment(data) {
            const card = document.createElement("article");
            card.className = "card";
            card.style.cssText = "padding:20px;border-left:4px solid var(--primary);border-top:0;border-right:0;border-bottom:0;border-radius:0";
            const name = document.createElement("strong");
            name.textContent = String(data.name || "Anonymous").slice(0, 40);
            const message = document.createElement("p");
            message.textContent = String(data.msg || "").slice(0, 500);
            message.style.cssText = "margin-top:5px;opacity:.9;white-space:pre-wrap;overflow-wrap:anywhere";
            card.append(name, message);
            return card;
        }

        db.collection("comments").orderBy("timestamp", "desc").limit(10).onSnapshot((snapshot) => {
            document.getElementById("comments-feed").replaceChildren(
                ...snapshot.docs.map((documentSnapshot) => renderComment(documentSnapshot.data()))
            );
        }, () => {
            document.getElementById("comments-feed").innerHTML = '<p class="status-message">Guestbook messages are currently unavailable.</p>';
        });
    </script>
</body>
</html>
